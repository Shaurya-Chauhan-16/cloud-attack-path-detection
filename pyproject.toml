[project]
name = "cloud-attack-path-detection"
version = "0.1.0"
description = "Cloud-Network Attack Path and Lateral Movement Detection using Cross-Layer Security Telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
